<style>
:root{
  --bg:#0F1316;--bg-2:#151A1E;--bg-3:#1B2126;--line:#2A3238;--line-2:#39434A;
  --ink:#ECE8DF;--ink-2:#B9BFC2;--muted:#8A949A;
  --paper:#F3EFE6;--paper-2:#FBF9F4;--paper-ink:#171A1C;--paper-muted:#5C6467;--paper-line:#D9D4C8;
  --rust:#E0683C;--rust-2:#B54A24;--gold:#F2C14E;--teal:#6FB3B8;--sage:#8FB996;
  --serif:'Newsreader',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --w:1180px;--w-text:720px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
.wrap{max-width:var(--w);margin:0 auto;padding:0 40px}
.text{max-width:var(--w-text)}
@media (max-width:720px){.wrap{padding:0 20px}}
section[id]{scroll-margin-top:72px}

/* progress + chapter dots */
.progress{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--line);z-index:300}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),var(--gold))}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:250}
.dots a{width:10px;height:10px;border-radius:50%;background:var(--line-2);display:block;position:relative;transition:transform .2s,background .2s}
.dots a:hover,.dots a.on{background:var(--rust);transform:scale(1.35)}
.dots a span{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);opacity:0;pointer-events:none;transition:opacity .2s;background:var(--bg-2);padding:3px 8px;border:1px solid var(--line)}
.dots a:hover span{opacity:1}
@media (max-width:1100px){.dots{display:none}}
.topbar{position:sticky;top:3px;z-index:280;background:rgba(15,19,22,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:20px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);text-decoration:none}
.brand b{color:var(--rust);font-weight:600}
.chapters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chapters a{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-decoration:none;padding:7px 9px;white-space:nowrap;border-radius:3px}
.chapters a:hover{color:var(--ink);background:var(--bg-3)}
.chapters a.on{color:var(--gold)}

/* hero */
.hero{position:relative;padding:92px 0 72px;overflow:hidden;background:radial-gradient(1200px 600px at 70% -10%,rgba(224,104,60,.18),transparent 60%),radial-gradient(800px 500px at 10% 110%,rgba(111,179,184,.12),transparent 60%)}
.hero .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--gold);margin:0 0 22px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,6.2vw,5rem);line-height:1.02;letter-spacing:-.015em;margin:0 0 26px;max-width:17ch}
.hero h1 em{font-style:italic;color:var(--rust)}
.hero .lead{font-size:20px;line-height:1.6;max-width:640px;margin:0 0 14px;color:var(--ink)}
.hero .sub{font-size:15px;color:var(--ink-2);max-width:600px;margin:0 0 36px}
.hero .cta{display:inline-flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--rust);transform:translateY(-1px)}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.primary:hover{background:var(--rust-2)}
.btn.small{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}

/* conveyor */
.conveyor{margin-top:64px;position:relative;height:140px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.conveyor .track{position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 10px,transparent 10px 18px)}
.conveyor .node{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.conveyor .node i{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:all .3s}
.conveyor .node.on i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 8px rgba(242,193,78,.15)}
.conveyor .node span{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;position:absolute;top:26px}
.conveyor .node.on span{color:var(--ink)}
.card-fly{position:absolute;top:50%;left:-120px;width:104px;height:54px;border-radius:4px;background:var(--paper);color:var(--paper-ink);padding:8px 10px;font-size:10px;line-height:1.3;transform:translateY(-86px);animation:fly 9s linear infinite;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card-fly b{display:block;font-size:10.5px;margin-bottom:2px}
.card-fly.c2{animation-delay:-3s}.card-fly.c3{animation-delay:-6s}
@keyframes fly{0%{left:-10%}100%{left:102%}}
@media (max-width:720px){.conveyor .node span{font-size:9px}.card-fly{display:none}}

/* sections */
.sec{padding:96px 0}
.sec.alt{background:var(--bg-2)}
.sec.paper{background:var(--paper);color:var(--paper-ink)}
.sec.paper .eyebrow{color:var(--rust-2)}
.sec.paper .muted,.sec.paper p.muted{color:var(--paper-muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--gold);margin:0 0 16px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,3.8vw,2.9rem);line-height:1.1;letter-spacing:-.01em;margin:0 0 20px;max-width:20ch}
.sec h3{font-family:var(--sans);font-weight:700;font-size:1.05rem;margin:0 0 10px}
.sec p{margin:0 0 1.1em}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line-2);padding:4px 0 4px 14px;margin:18px 0}
.sec.paper .note{border-color:var(--paper-line)}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:960px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.panel{background:var(--bg-3);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
.sec.paper .panel{background:var(--paper-2);border-color:var(--paper-line)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* timeline */
.timeline{position:relative;margin:36px 0 10px;overflow-x:auto;padding-bottom:8px}
.timeline svg{min-width:860px;width:100%;height:auto;display:block}
.tl-card{margin-top:18px;min-height:88px;display:flex;gap:18px;align-items:flex-start}
.tl-card .date{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap;padding-top:4px}
.tl-card h3{margin:0 0 6px}
.tl-card p{margin:0;color:var(--ink-2);font-size:15px}
.tl-marker{cursor:pointer}
.tl-marker circle{transition:r .2s,fill .2s}
.tl-marker:hover circle,.tl-marker.on circle{fill:var(--gold);r:9}
.tl-marker text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tl-marker.on text{fill:var(--ink)}

/* charts */
.chart{margin:14px 0 0}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.bars .bar{height:14px;background:var(--line);border-radius:2px;overflow:hidden}
.bars .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.bars .row.hi .bar i{background:var(--rust)}
.bars .row.gold .bar i{background:var(--gold)}
.bars .val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);text-align:right}
.sec.paper .bars .bar{background:#E6E1D6}
.sec.paper .bars .val{color:var(--paper-muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--rust);color:#fff}
.sec.paper .seg{border-color:var(--paper-line)}
.sec.paper .seg button{color:var(--paper-muted)}
.donut{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
@media (max-width:520px){.donut{grid-template-columns:1fr}}
.legend{list-style:none;margin:0;padding:0;font-size:14px}
.legend li{display:flex;align-items:center;gap:10px;margin:6px 0}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legend b{font-family:var(--mono);font-weight:500;font-size:12.5px;margin-left:auto;color:var(--ink-2)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media (max-width:640px){.ladder{grid-template-columns:1fr 1fr}}
.ladder .step{background:var(--bg-3);border:1px solid var(--line);padding:16px;border-radius:6px}
.ladder .step small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px}
.ladder .step b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1}
.ladder .step b::after{content:'%';font-size:1rem;color:var(--muted);margin-left:2px}

/* capability matrix */
.matrix{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
.matrix th,.matrix td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.matrix th{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:500}
.matrix td.c{text-align:center}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:3px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.core{border-color:var(--sage);color:var(--sage)}
.pill.plug{border-color:var(--line-2);color:var(--muted)}
.pill.part{border-color:var(--gold);color:var(--gold)}
.matrix tr:hover td{background:rgba(255,255,255,.025)}
.matrix td.cap{font-weight:600}
.matrix td.cap small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px}
.mwrap{overflow-x:auto}

/* simulator */
.sim{display:grid;grid-template-columns:260px 1fr;gap:22px;margin-top:22px}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.roles{display:flex;flex-direction:column;gap:8px}
.role{border:1px solid var(--paper-line);background:var(--paper-2);padding:12px 14px;border-radius:6px;text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .2s,background .2s}
.role.on{border-color:var(--rust-2);background:#FFF}
.role .av{width:36px;height:36px;border-radius:50%;background:var(--rust);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;flex-shrink:0}
.role b{display:block;font-size:14px}
.role small{display:block;color:var(--paper-muted);font-size:12px;margin-top:2px}
.admin{background:#fff;border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(23,26,28,.08)}
.admin .bar{display:flex;align-items:center;gap:10px;background:#1F2A30;color:#DCE3E6;padding:10px 14px;font-family:var(--mono);font-size:12px}
.admin .bar i{width:10px;height:10px;border-radius:50%;background:#E0683C;display:inline-block}
.admin .body{display:grid;grid-template-columns:180px 1fr;min-height:360px}
@media (max-width:640px){.admin .body{grid-template-columns:1fr}}
.menu{background:#F6F4EE;border-right:1px solid var(--paper-line);padding:14px 0}
.menu div{padding:9px 16px;font-size:13.5px;color:var(--paper-ink);display:flex;align-items:center;gap:8px;transition:opacity .25s}
.menu div.off{opacity:.22;text-decoration:line-through}
.menu div::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--rust)}
.menu div.off::before{background:#AAA}
.menu .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--paper-muted);padding:10px 16px 4px}
.menu .cap::before{display:none}
.work{padding:18px 20px}
.article{border:1px solid var(--paper-line);border-radius:6px;padding:16px 18px;background:#fff}
.article .st{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:3px;background:#EEE9DD;color:var(--paper-muted);margin-bottom:10px}
.article .st.pub{background:#DCEBDD;color:#2F6B3A}
.article h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.2}
.article p{margin:0 0 12px;font-size:14px;color:var(--paper-muted)}
.stages{display:flex;gap:6px;margin:12px 0 14px}
.stages i{flex:1;height:6px;border-radius:3px;background:#E6E1D6;transition:background .3s}
.stages i.done{background:var(--sage)}.stages i.cur{background:var(--rust)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{border-color:var(--paper-line);background:#F6F4EE;color:var(--paper-ink)}
.acts .btn:hover{border-color:var(--rust-2)}
.acts .btn.back{background:transparent}
.acts .btn.go{background:var(--rust);border-color:var(--rust);color:#fff}
.lock{font-size:12.5px;color:var(--paper-muted);margin-top:10px;font-style:italic}
.log{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--paper-muted);max-height:120px;overflow:auto;border-top:1px dashed var(--paper-line);padding-top:10px}
.log div{padding:2px 0}
.log div b{color:var(--rust-2);font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:38px;height:22px;border-radius:11px;background:#D5CFC2;position:relative;transition:background .2s;margin:0}
.toggle input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle input:checked{background:var(--rust)}
.toggle input:checked::after{left:19px}
.sec:not(.paper) .toggle input{background:var(--line-2)}

/* taxonomy */
.tax{display:grid;grid-template-columns:320px 1fr;gap:26px;margin-top:22px}
@media (max-width:900px){.tax{grid-template-columns:1fr}}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--paper-line)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:2px 0}
.tree button{background:transparent;border:0;padding:5px 8px;border-radius:4px;font-size:14px;color:var(--paper-ink);display:inline-flex;gap:8px;align-items:center;text-align:left}
.tree button:hover{background:#EEE9DD}
.tree button.on{background:var(--rust);color:#fff}
.tree button .n{font-family:var(--mono);font-size:11px;color:var(--paper-muted);background:#EEE9DD;padding:1px 6px;border-radius:3px}
.tree button.on .n{background:rgba(255,255,255,.25);color:#fff}
.tree .root>button{font-weight:700}
.feed{display:grid;gap:10px}
.feed .it{background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feed .it b{font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.25;display:block}
.feed .it small{color:var(--paper-muted);font-size:12.5px}
.feed .it .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.feed .it .tags span{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:3px;background:#EEE9DD;color:var(--paper-muted)}
.feed .it .tags span.hit{background:var(--rust);color:#fff}
.feed .cat{font-family:var(--mono);font-size:10.5px;color:var(--paper-muted);border:1px solid var(--paper-line);padding:2px 7px;border-radius:3px;white-space:nowrap}
.feed .empty{color:var(--paper-muted);font-style:italic;padding:20px 0}
.taxctl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.flat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.flat span{font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px dashed var(--paper-line);color:var(--paper-muted);border-radius:3px}

/* load */
.load{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px}
@media (max-width:900px){.load{grid-template-columns:1fr}}
input[type=range]{width:100%;accent-color:var(--rust)}
.layers{display:grid;gap:10px;margin-top:14px}
.layer{display:grid;grid-template-columns:120px 1fr 110px;gap:12px;align-items:center;font-size:14px}
.layer .bar{height:28px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.layer .bar i{display:block;height:100%;width:0;transition:width .5s ease}
.layer .bar i.cdn{background:var(--teal)}.layer .bar i.redis{background:var(--gold)}.layer .bar i.php{background:var(--rust)}.layer .bar i.db{background:#C84B4B}
.layer .n{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.big{font-family:var(--serif);font-weight:300;font-size:3.2rem;line-height:1;margin:6px 0 2px}
.big small{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.logbars .row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;margin:14px 0;font-size:14px}
.logbars .pair{display:grid;gap:5px}
.logbars .b{height:12px;border-radius:2px;position:relative;background:var(--line)}
.logbars .b i{display:block;height:100%;width:0;border-radius:2px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.logbars .b.before i{background:#C84B4B}.logbars .b.after i{background:var(--sage)}
.logbars .b span{position:absolute;left:calc(100% + 8px);top:-3px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}

/* schema generator */
.gen{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px}
@media (max-width:900px){.gen{grid-template-columns:1fr}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.field input,.field select{background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);padding:10px 12px;border-radius:4px;font:inherit;font-size:15px}
.field input:focus,.field select:focus{outline:2px solid var(--rust);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);padding:5px 10px;border-radius:3px;font-size:13px}
.chips button.on{border-color:var(--gold);color:var(--gold)}
pre.code{background:#0B0E10;border:1px solid var(--line);border-radius:6px;padding:18px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#CFE3C7;overflow:auto;margin:0;min-height:300px}
pre.code .k{color:#8FD1E0}pre.code .s{color:#F2C14E}pre.code .c{color:#6C7A80}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;margin-top:28px}
@media (max-width:760px){.flow{grid-template-columns:1fr}.flow .arrow{transform:rotate(90deg);justify-self:center}}
.flow .box{background:var(--bg-3);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:14px}
.flow .box b{display:block;margin-bottom:6px}
.flow .box ul{margin:0;padding-left:16px;color:var(--ink-2);font-size:13.5px}
.flow .arrow{color:var(--rust);font-size:22px}
.flow .box.pulse{border-color:var(--gold);box-shadow:0 0 0 1px rgba(242,193,78,.25) inset}

/* portals */
.portals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
@media (max-width:960px){.portals{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.portals{grid-template-columns:1fr}}
.portal{background:var(--bg-3);border:1px solid var(--line);border-radius:6px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.portal:hover{border-color:var(--rust);transform:translateY(-2px)}
.portal .rank{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid rgba(242,193,78,.4);padding:3px 8px;border-radius:3px}
.portal .rank.top1k{color:var(--rust);border-color:rgba(224,104,60,.5)}
.portal h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0 0 4px}
.portal .country{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:12px}
.portal .stack{display:flex;flex-wrap:wrap;gap:5px}
.portal .stack span{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2)}
.portal p{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.rankbar{margin-top:24px;position:relative;height:60px}
.rankbar .ax{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line-2)}
.rankbar .tick{position:absolute;top:34px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.rankbar .pin{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.rankbar .pin i{width:10px;height:10px;border-radius:50%;background:var(--rust)}
.rankbar .pin span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;position:absolute;top:-22px}

/* constellation */
.sky{position:relative;margin-top:24px;background:radial-gradient(600px 300px at 50% 50%,rgba(111,179,184,.08),transparent 70%);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sky svg{display:block;width:100%;height:auto}
.sky .star{cursor:pointer}
.sky .star circle{transition:r .2s,fill .2s}
.sky .star:hover circle,.sky .star.on circle{fill:var(--gold)}
.sky .star text{font-family:var(--mono);font-size:11px;fill:var(--ink-2);pointer-events:none}
.sky .link{stroke:var(--line-2);stroke-width:1;opacity:.7}
.skycard{margin-top:16px;min-height:70px;font-size:15px;color:var(--ink-2)}
.skycard b{color:var(--ink)}

/* kz */
.fallback{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media (max-width:640px){.fallback{grid-template-columns:1fr}}
.strings{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:13px}
.strings li{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.strings li span:last-child{color:var(--ink)}
.strings li.miss span:last-child{color:var(--rust)}
.strings li.ru span:last-child{color:var(--teal)}

/* scale */
.scale{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start;margin-top:20px}
@media (max-width:900px){.scale{grid-template-columns:1fr}}
.weights label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.weights input{accent-color:var(--rust);margin-top:5px}
.weights small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.beam{display:flex;justify-content:center}
.beam svg{width:100%;max-width:360px;height:auto}
.beam g.arm{transition:transform .8s cubic-bezier(.3,.7,.3,1);transform-origin:180px 70px}
.verdict{text-align:center;font-family:var(--serif);font-size:1.3rem;margin-top:10px}

/* checklist */
.check{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.check li label{display:flex;gap:12px;align-items:flex-start;background:var(--bg-3);border:1px solid var(--line);padding:12px 14px;border-radius:6px;cursor:pointer;font-size:14.5px}
.check li input{accent-color:var(--rust);margin-top:4px}
.check li input:checked+span{color:var(--muted);text-decoration:line-through}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}

/* footer */
footer{padding:64px 0 54px;border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
@media (max-width:760px){footer .cols{grid-template-columns:1fr}}
footer h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
footer ul{margin:0;padding-left:16px}
footer li{margin:4px 0}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- 07¾: модули, адрес, каталог ---------- */
.ln-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ln-tabs button{border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.ln-tabs button[aria-selected="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.ln-stage{position:relative;min-height:340px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:16px;overflow:hidden}
.ln-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.ln-chips button{border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:3px;padding:4px 10px;font-size:13px}
.ln-chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ln-chips label{margin-left:auto;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.ln-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ln-grid.masonry{display:block;columns:3;column-gap:12px}
.ln-grid.masonry .ln-card{break-inside:avoid;margin-bottom:12px}
.ln-card{background:var(--bg-3);border:1px solid var(--line);border-radius:5px;overflow:hidden;transition:opacity .35s,transform .35s;text-align:left;padding:0;color:inherit;width:100%}
.ln-card.hide{opacity:0;transform:scale(.92);pointer-events:none;position:absolute;visibility:hidden}
.ln-thumb{aspect-ratio:16/10;display:block}
.ln-card .b{padding:9px 11px 11px;display:block}
.ln-card .m{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}
.ln-card .t{font-size:13.5px;font-weight:600;line-height:1.35;margin-top:3px;display:block}
.ln-slider{position:relative;padding:0 46px}
.ln-view{overflow:hidden}
.ln-track{display:flex;gap:12px;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.ln-track .ln-card{flex:0 0 calc((100% - 24px)/3)}
.ln-arrow{position:absolute;top:38%;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);font-size:18px;line-height:1}
.ln-arrow.l{left:0}.ln-arrow.r{right:0}
.ln-dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.ln-dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line-2)}
.ln-dots button.on{background:var(--gold)}
.ln-status{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.ln-modal{position:absolute;inset:0;background:rgba(8,10,12,.78);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.ln-modal.open{opacity:1;pointer-events:auto}
.ln-dialog{background:var(--paper);color:var(--paper-ink);border-radius:6px;max-width:560px;width:100%;overflow:hidden;transform:translateY(12px);transition:transform .25s}
.ln-modal.open .ln-dialog{transform:none}
.ln-dialog .ln-thumb{aspect-ratio:16/8}
.ln-dialog .b{padding:14px 18px 18px}
.ln-dialog h4{margin:0 0 6px;font-family:var(--serif);font-size:21px;line-height:1.25}
.ln-dialog p{margin:0 0 12px;font-size:14px;color:var(--paper-muted)}
.ln-dialog .acts{display:flex;gap:8px;flex-wrap:wrap}
.ln-dialog .acts button{border:1px solid var(--paper-line);background:#fff;border-radius:4px;padding:7px 12px;font-size:13.5px;color:var(--paper-ink)}
.ln-dialog .acts button.p{background:var(--rust-2);border-color:var(--rust-2);color:#fff}
.ln-gal{columns:4;column-gap:10px}
.ln-tile{display:block;width:100%;margin:0 0 10px;border:0;padding:0;border-radius:4px;position:relative;overflow:hidden;break-inside:avoid;cursor:zoom-in}
.ln-tile::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .25s}
.ln-tile .z{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #fff;opacity:0;transform:scale(.7);transition:.25s;z-index:1}
.ln-tile .z::after{content:"";position:absolute;width:10px;height:2px;background:#fff;right:-8px;bottom:-4px;transform:rotate(45deg)}
.ln-tile:hover::after,.ln-tile:focus-visible::after{background:rgba(0,0,0,.35)}
.ln-tile:hover .z,.ln-tile:focus-visible .z{opacity:1;transform:scale(1)}
.ln-lb{position:absolute;inset:0;background:rgba(5,6,8,.94);display:grid;grid-template-rows:1fr auto;padding:14px 56px;opacity:0;pointer-events:none;transition:opacity .25s}
.ln-lb.open{opacity:1;pointer-events:auto}
.ln-lb .ph{border-radius:4px;align-self:center;justify-self:center;width:min(100%,520px);aspect-ratio:3/2}
.ln-lb .cap{text-align:center;padding-top:10px}
.ln-lb .cap b{display:block;font-size:15px}
.ln-lb .cap span{font-size:13px;color:var(--muted)}
.ln-lb .cap a{font-size:13px;color:var(--gold)}
.ln-lb .nav{position:absolute;top:45%;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:#fff;font-size:18px}
.ln-lb .nav.l{left:10px}.ln-lb .nav.r{right:10px}
.ln-lb .x{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;font-size:22px}
.ln-lb .cnt{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ln-about{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:14px}
.ln-about ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.ln-about li{margin:3px 0}
.ln-url{display:grid;gap:10px;margin-top:14px}
.ln-row{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:var(--bg)}
.ln-row .k{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ln-row code{display:block;font-family:var(--mono);font-size:13px;word-break:break-all;margin-top:4px;color:var(--ink)}
.ln-row s{color:var(--muted)}
.ln-row .bad{color:var(--rust)}.ln-row .ok{color:var(--sage)}
.ln-row.ta{border-color:var(--teal)}
.ln-input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:4px;color:var(--ink);padding:10px 12px;font:inherit;font-size:15px}
.ln-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ln-ctl select{background:var(--bg);color:var(--ink);border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;font:inherit;font-size:14px}
.ln-myth{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ln-myth .q{padding:14px 16px;background:linear-gradient(135deg,rgba(224,104,60,.18),transparent);font-family:var(--serif);font-size:19px;line-height:1.3}
.ln-myth .q small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--rust);letter-spacing:.06em;margin-bottom:4px}
.ln-myth ol{margin:0;padding:12px 16px 14px 34px;font-size:14px;color:var(--ink-2)}
.ln-myth li{margin:6px 0}
.ln-sea svg{width:100%;height:auto;display:block}
.ln-sea .lg{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-2);margin-top:8px}
.ln-sea .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ln-tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.ln-tpl h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:500}
.ln-tpl ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ln-tpl li{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13.5px;background:var(--bg)}
.ln-tpl li span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (max-width:760px){.ln-grid{grid-template-columns:1fr 1fr}.ln-grid.masonry{columns:2}.ln-track .ln-card{flex-basis:100%}.ln-gal{columns:2}.ln-about{grid-template-columns:1fr}.ln-tpl{grid-template-columns:1fr}.ln-lb{padding:14px 44px}}
@media (max-width:460px){.ln-grid{grid-template-columns:1fr}.ln-grid.masonry{columns:1}.ln-slider{padding:0 38px}}
@media (max-width:640px){.logbars .b{margin-right:62px}}
.grid>*,.ladder>*,.load>*,.fallback>*,.strings li>*{min-width:0}
.strings li span{overflow-wrap:anywhere}
#lenta .src,#lenta code,.ln-tpl li{overflow-wrap:anywhere}
.ln-about .btn{white-space:normal}
@media (min-width:641px) and (max-width:900px){.ladder{grid-template-columns:1fr 1fr}}
</style>
</head>
