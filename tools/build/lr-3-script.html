<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- навигация, прогресс, появление ---------- */
const secs=$$('section[id]');
const chapters=$('#chapters'), dots=$('#dots');
secs.forEach(s=>{
  chapters.insertAdjacentHTML('beforeend',`<a href="#${s.id}">${esc(s.dataset.title)}</a>`);
  dots.insertAdjacentHTML('beforeend',`<a href="#${s.id}"><span>${esc(s.dataset.title)}</span></a>`);
});
const prog=$('#prog');
const onScroll=()=>{const h=document.documentElement;const m=h.scrollHeight-h.clientHeight;prog.style.width=(m>0?h.scrollTop/m*100:0)+'%';};
addEventListener('scroll',onScroll,{passive:true});onScroll();
const setOn=id=>$$('#chapters a, #dots a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setOn(e.target.id);}),{rootMargin:'-40% 0px -55% 0px'});
  secs.forEach(s=>io.observe(s));
  const rv=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rv.unobserve(e.target);}}),{threshold:.12});
  $$('.reveal').forEach(el=>rv.observe(el));
}else{$$('.reveal').forEach(el=>el.classList.add('in'));}

/* ---------- конвейер в шапке ---------- */
const nodes=$$('#conveyor .node');let ni=0;
setInterval(()=>{nodes.forEach((n,i)=>n.classList.toggle('on',i===ni));ni=(ni+1)%nodes.length;},1800);

/* ---------- таймлайн ---------- */

 {y:2005.63,l:'2005',t:'Рождение проекта',d:'17 августа 2005',p:'Команда Mambo уходит от владельца марки и основывает независимый проект; имя — от суахили jumla, «все вместе».'},
 {y:2012.75,l:'3.0',t:'Joomla 3',d:'сентябрь 2012',p:'Ветка, на которой до сих пор работает 51,9 % сайтов с Joomla и все найденные крупные порталы.'},
 {y:2021.63,l:'4.0',t:'Joomla 4',d:'17 августа 2021',p:'Новая архитектура, процессы публикации, планировщик задач, Web Services API, административный шаблон Atum.'},
 {y:2023.79,l:'5.0',t:'Joomla 5',d:'17 октября 2023',p:'Schema.org в ядре, тёмная тема и TUF в 5.1, автообновления в 5.4.'},
 {y:2025.79,l:'6.0',t:'Joomla 6.0 «Kuimarisha»',d:'14 октября 2025',p:'Автообновления ядра, дочерний шаблон с настройкой цветов, версии полей, тегов и категорий, TinyMCE 8. Переход с 5.4 — обновлением.'},
 {y:2026.29,l:'6.1',t:'Joomla 6.1 «Nyota»',d:'14 апреля 2026',p:'Proof-of-Work CAPTCHA без внешних сервисов, визуальный редактор процессов, медиаполя для аудио, видео и документов, версии и ассоциации модулей.'},
 {y:2026.79,l:'6.2',t:'Joomla 6.2',d:'13 октября 2026 (релиз-кандидат — 29 сентября)',p:'Новая система сборки, многоуровневое меню, CSS-классы для изображений, цепочки запасных языков интерфейса, PHPUnit 12.'},
 {y:2027.79,l:'5.x',t:'Конец безопасности ветки 5',d:'12 октября 2027',p:'Исправления ошибок для 5.x завершились 13 октября 2026 года; ещё год ветка получает только исправления безопасности.'},
 {y:2027.79,l:'7.0',t:'Joomla 7.0 — уже в разработке',d:'план — 12 октября 2027',p:'В репозитории ядра открыты ветки 6.3-dev и 7.0-dev; в Version.php седьмой ветки стоит плановая дата выпуска 12 октября 2027 года — ровно по двухлетнему ритму.'},
 {y:2029.79,l:'6.x',t:'Конец безопасности ветки 6',d:'16 октября 2029',p:'Исправления ошибок — до 17 октября 2028 года, безопасность — до 16 октября 2029 года.'}
];
(function timeline(){
  const W=900,H=150,x0=40,x1=870,y=78,Y0=2005,Y1=2030;
  const X=v=>x0+(v-Y0)/(Y1-Y0)*(x1-x0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Таймлайн версий Joomla">`;
  s+=`<rect x="${X(2023.79)}" y="${y-46}" width="${X(2026.79)-X(2023.79)}" height="8" rx="2" fill="rgba(111,179,184,.35)"/><rect x="${X(2026.79)}" y="${y-46}" width="${X(2027.79)-X(2026.79)}" height="8" rx="2" fill="rgba(111,179,184,.15)"/>`;
  s+=`<rect x="${X(2025.79)}" y="${y+16}" width="${X(2028.79)-X(2025.79)}" height="8" rx="2" fill="rgba(242,193,78,.4)"/><rect x="${X(2028.79)}" y="${y+16}" width="${X(2029.79)-X(2028.79)}" height="8" rx="2" fill="rgba(242,193,78,.15)"/>`;
  s+=`<text x="${X(2027.79)}" y="${y-52}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="var(--teal)">ветка 5: исправления до 13.10.2026 → безопасность до 12.10.2027</text>`;
  s+=`<text x="${X(2029.79)}" y="${y+38}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="var(--gold)">ветка 6: исправления до 17.10.2028 → безопасность до 16.10.2029</text>`;
  s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--line-2)" stroke-width="2"/>`;
  for(let yr=2005;yr<=2029;yr+=3){s+=`<text x="${X(yr)}" y="${H-10}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${yr}</text><line x1="${X(yr)}" y1="${y-4}" x2="${X(yr)}" y2="${y+4}" stroke="var(--line-2)"/>`;}
  TL.forEach((m,i)=>{s+=`<g class="tl-marker" data-i="${i}"><circle cx="${X(m.y)}" cy="${y}" r="6" fill="${i===4?'var(--gold)':'var(--rust)'}"/><text x="${X(m.y)}" y="${y-16-(i%2?14:0)}" text-anchor="middle">${esc(m.l)}</text></g>`;});
  s+='</svg>';
  $('#timeline').innerHTML=s;
  const card=$('#tlcard');
  const show=i=>{const m=TL[i];card.innerHTML=`<div class="date">${esc(m.d)}</div><div><h3>${esc(m.t)}</h3><p>${esc(m.p)}</p></div>`;$$('.tl-marker').forEach(g=>g.classList.toggle('on',+g.dataset.i===i));};
  $$('.tl-marker').forEach(g=>{g.addEventListener('click',()=>show(+g.dataset.i));g.addEventListener('mouseenter',()=>show(+g.dataset.i));});
  show(4);
})();

/* ---------- рынок ---------- */
const SHARE=[{n:'WordPress',all:40.1,cms:58.6},{n:'Shopify',all:5.4,cms:7.8},{n:'Wix',all:4.2,cms:6.1},{n:'Squarespace',all:2.4,cms:3.6},{n:'Joomla',all:1.1,cms:1.6,hi:1},{n:'Drupal',all:0.6,cms:0.9}];
const fmt=v=>String(v).replace('.',',');
function bars(el,rows,max,unit='%'){
  el.innerHTML=rows.map(r=>`<div class="row ${r.hi?'hi':''} ${r.gold?'gold':''}"><span>${esc(r.n)}</span><div class="bar"><i data-w="${r.v/max*100}"></i></div><span class="val">${fmt(r.v)}${unit}</span></div>`).join('');
  requestAnimationFrame(()=>setTimeout(()=>$$('i[data-w]',el).forEach(i=>i.style.width=i.dataset.w+'%'),60));
}
function drawShare(k){bars($('#shareBars'),SHARE.map(r=>({n:r.n,v:r[k],hi:r.hi})),k==='all'?42:60);}
drawShare('all');
$$('#segShare button').forEach(b=>b.addEventListener('click',()=>{$$('#segShare button').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawShare(b.dataset.k);}));
/* donut версий */
(function(){
  const V=[{n:'3.x',v:51.9,c:'#C84B4B'},{n:'5.x',v:20.6,c:'#6FB3B8'},{n:'6.x',v:9.2,c:'#F2C14E'},{n:'4.x',v:8.0,c:'#8FB996'},{n:'2.x',v:6.0,c:'#39434A'},{n:'1.x',v:4.4,c:'#2A3238'}];
  const R=80,C=2*Math.PI*R;let off=0,s='';

  s+=`<text x="100" y="96" text-anchor="middle" font-family="var(--serif)" font-size="30" fill="var(--ink)">51,9</text><text x="100" y="116" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">% на ветке 3</text>`;
  $('#donutVer').innerHTML=s;
  $('#legVer').innerHTML=V.map(d=>`<li><i style="background:${d.c}"></i>Joomla ${d.n}<b>${fmt(d.v)} %</b></li>`).join('');
})();
bars($('#langBars'),[{n:'английский',v:24.6},{n:'немецкий',v:15.9},{n:'русский',v:12.3,hi:1},{n:'испанский',v:6.2},{n:'другие',v:41.0}],45);
$('#ladder').innerHTML=[['первая тысяча','0,4'],['первые 10 тыс.','0,5'],['первые 100 тыс.','1,1'],['первый миллион','1,2']].map(r=>`<div class="step"><small>${r[0]}</small><b>${r[1]}</b></div>`).join('');

/* ---------- матрица ядра ---------- */
const CAP=[
 ['Процесс публикации со стадиями и переходами','стадии, переходы, права на переход, письма; свой процесс на категорию; визуальный редактор в 6.1','core','plug','core'],
 ['Роли и права на уровне категории','девять групп; права на сайт, компонент и категорию; зона ответственности редактора отдела — его категория','core','plug','core'],
 ['Версии материала с откатом','кто, когда и зачем; с 6.0 — вместе с пользовательскими полями, тегами, категориями; в 6.1 — модули','core','core','core'],
 ['Эмбарго, снятие по дате, окно избранного','начало и конец публикации, начало и конец «избранности»; с лицевой стороны тоже','core','part','core'],
 ['Многоязычие с ассоциациями переводов','ассоциации материалов, категорий, меню, модулей; с 6.2 — запасной язык интерфейса','core','plug','core'],
 ['Вложенные метки поверх любого содержимого','дерево «родитель — потомок»; страница метки с включёнными потомками; общие для материалов, контактов, лент','core','part','core'],
 ['Баннеры с кампаниями и учётом показов','клиенты, кампании, лимиты показов, клики — рекламный отдел без плагина','core','plug','plug'],
 ['Поиск с индексом и статистикой запросов','Smart Search: индексация, подсказки, фильтры, статистика; для очень больших сайтов — Solr','core','part','part'],
 ['Web Services API','JSON:API с токеном: материалы, категории, метки, пользователи — для приложений и партнёрских лент','core','core','core'],
 ['Разметка Schema.org в JSON-LD','типовые плагины Article, BlogPosting, Organization, Custom…; NewsArticle с автозаполнением — готовыми расширениями (Google Structured Data, PSA Schema) или своим плагином','part','plug','plug'],
 ['Планировщик задач и консоль','переиндексация, рассылки, карты сайта по расписанию; запуск из CLI','core','part','core'],
 ['Многофакторная аутентификация и ключи доступа','первая крупная CMS с двухфакторной защитой; WebAuthn без пароля','core','plug','plug']
];
const PL={core:'<span class="pill core">в ядре</span>',plug:'<span class="pill plug">плагин</span>',part:'<span class="pill part">частично</span>'};
(function(){
  const t=$('#matrix');
  t.innerHTML='<thead><tr><th>возможность</th><th class="c">Joomla 6</th><th class="c">WordPress 7</th><th class="c">Drupal 11</th></tr></thead><tbody>'+
   CAP.map((r,i)=>`<tr data-i="${i}"><td class="cap">${esc(r[0])}<small hidden>${esc(r[1])}</small></td><td class="c">${PL[r[2]]}</td><td class="c">${PL[r[3]]}</td><td class="c">${PL[r[4]]}</td></tr>`).join('')+'</tbody>';
  $$('tbody tr',t).forEach(tr=>tr.addEventListener('click',()=>{const sm=$('small',tr);sm.hidden=!sm.hidden;}));
})();

/* ---------- симулятор ролей ---------- */
const STAGES=['Черновик','На редактуре','На корректуре','На утверждении','Опубликовано'];
const ROLES={
 reporter:{n:'Репортёр',s:'создаёт и правит своё',av:'Р',menu:['Материалы'],ids:[0]},
 editor:{n:'Редактор отдела',s:'правит и публикует в своей категории',av:'РО',menu:['Материалы','Категории','Метки','Медиа'],ids:[0,1]},
 proof:{n:'Корректор',s:'правит чужое, состояние не меняет',av:'К',menu:['Материалы','Медиа'],ids:[0,2]},
 chief:{n:'Главред',s:'утверждает особо важное, видит всё редакционное',av:'Г',menu:['Материалы','Категории','Метки','Медиа','Модули','Меню','Баннеры','Пользователи'],ids:[0,1,2,3]}
};
const MENU=[['cap','содержимое'],'Материалы','Категории','Метки','Медиа',['cap','сайт'],'Модули','Меню','Баннеры',['cap','служба'],'Пользователи','Система'];
const TR=[
 {f:0,t:1,l:'Отправить на редактуру',roles:['reporter','editor','chief'],go:1,mail:'редакторам отдела'},
 {f:1,t:0,l:'Вернуть автору',roles:['editor','chief'],back:1,mail:'автору'},
 {f:1,t:2,l:'На корректуру',roles:['editor','chief'],go:1,mail:'корректорам'},
 {f:2,t:1,l:'Вернуть редактору',roles:['proof','chief'],back:1,mail:'редактору отдела'},
 {f:2,t:4,l:'Опубликовать',roles:['editor','chief'],go:1,pub:1,mail:'автору',noImportant:1},
 {f:2,t:3,l:'На утверждение главреду',roles:['editor','chief'],go:1,mail:'главреду'},
 {f:3,t:1,l:'Вернуть в отдел',roles:['chief'],back:1,mail:'редактору отдела'},
 {f:3,t:4,l:'Утвердить и опубликовать',roles:['chief'],go:1,pub:1,mail:'отделу'},
 {f:4,t:1,l:'Снять с публикации',roles:['chief'],back:1,mail:'редактору отдела'}
];
let role='reporter',stage=0,published=false;
const rolesEl=$('#roles'),menuEl=$('#menu'),acts=$('#acts'),lock=$('#lock'),log=$('#log');
rolesEl.innerHTML=Object.entries(ROLES).map(([k,r])=>`<button class="role ${k===role?'on':''}" data-r="${k}"><span class="av">${r.av}</span><span><b>${r.n}</b><small>${r.s}</small></span></button>`).join('');
const addLog=(t)=>{log.insertAdjacentHTML('afterbegin',`<div>${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} · ${t}</div>`);};
function renderSim(){
  const R=ROLES[role],imp=$('#important').checked,front=$('#frontend').checked;
  $('#adminTitle').textContent=(front?'Лицевая сторона сайта · форма материала · ':'Панель управления · ')+R.n.toLowerCase();
  menuEl.innerHTML=MENU.map(m=>Array.isArray(m)?`<div class="cap">${m[1]}</div>`:`<div class="${R.menu.includes(m)?'':'off'}">${m}</div>`).join('');
  menuEl.style.display=front?'none':'';
  $('#stageBar').innerHTML=STAGES.map((s,i)=>`<i class="${i<stage?'done':i===stage?'cur':''}" title="${s}"></i>`).join('');
  const st=$('#artState');st.textContent='стадия: '+STAGES[stage].toLowerCase()+(published?' · состояние: опубликовано':' · состояние: не опубликовано');st.classList.toggle('pub',published);
  const avail=TR.filter(t=>t.f===stage&&!(imp&&t.noImportant));
  acts.innerHTML=avail.map((t,i)=>{const ok=t.roles.includes(role);return `<button class="btn small ${t.back?'back':t.go?'go':''}" data-i="${TR.indexOf(t)}" ${ok?'':'disabled'} title="${ok?'право «выполнить переход» есть':'у группы нет права на этот переход'}">${t.l}</button>`;}).join('');
  const denied=avail.filter(t=>!t.roles.includes(role));
  lock.textContent=denied.length?`Недоступно для роли «${R.n.toLowerCase()}»: ${denied.map(t=>t.l.toLowerCase()).join(', ')} — право на переход закреплено за другими группами.`:(avail.length?'':'Материал на сайте; изменить состояние может только главред.');
  if(imp&&stage===2&&role==='editor')lock.textContent='Материал особой важности: кнопка публикации у редактора отдела снята, путь идёт через главреда.';
}
rolesEl.addEventListener('click',e=>{const b=e.target.closest('.role');if(!b)return;role=b.dataset.r;$$('.role').forEach(x=>x.classList.toggle('on',x===b));addLog(`вход: <b>${ROLES[role].n}</b>; админ-меню собрано по правам группы`);renderSim();});
acts.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b||b.disabled)return;const t=TR[+b.dataset.i];stage=t.t;if(t.pub)published=true;if(t.back&&stage!==4)published=false;addLog(`<b>${t.l}</b> → стадия «${STAGES[stage].toLowerCase()}»${t.pub?', состояние published':''}; письмо: ${t.mail}`);renderSim();});
$('#important').addEventListener('change',()=>{addLog($('#important').checked?'категория «особой важности»: процесс требует стадии главреда':'обычная категория: редактор отдела публикует сам');renderSim();});
$('#frontend').addEventListener('change',()=>{addLog($('#frontend').checked?'подача с лицевой стороны: те же стадии и права во вкладке «Публикация»':'возврат в панель управления');renderSim();});
renderSim();addLog('новость создана репортёром и сохранена в стадии «черновик»');

 {t:'Биржа открылась ростом: индекс прибавил 1,4 %',c:'Экономика',g:['Финансы','Банки']},
 {t:'Банки РК переходят на мгновенные переводы по QR',c:'Экономика',g:['Банки','Платёжные системы','Астана']},
 {t:'Как устроен тариф на электроэнергию: разбор',c:'Экономика',g:['Электроэнергетика','Разбор']},
 {t:'Актау: порт готовится к зимней навигации',c:'Регионы',g:['Актау','Транспорт']},
 {t:'Новое месторождение в Мангистау: что известно',c:'Экономика',g:['Нефть и газ','Мангистау']},
 {t:'Интервью с главой платёжного оператора',c:'Экономика',g:['Платёжные системы','Интервью']},
 {t:'Фоторепортаж: ночная смена на ТЭЦ',c:'Общество',g:['Электроэнергетика','Фотогалерея','Астана']},
 {t:'Алматы расширяет сеть метро: три станции',c:'Регионы',g:['Алматы','Транспорт']},
 {t:'Нефтяники пересмотрели прогноз добычи',c:'Экономика',g:['Нефть и газ','Разбор']},
 {t:'Город на Каспии: фотогалерея набережной',c:'Общество',g:['Актау','Фотогалерея']}
];
const treeEl=$('#tree'),feed=$('#feed');let sel=new Set(['Финансы']);
const desc=node=>{const out=[node.n];(node.c||[]).forEach(ch=>out.push(...desc(ch)));return out;};
const find=(node,n)=>node.n===n?node:(node.c||[]).map(ch=>find(ch,n)).find(Boolean);
const count=n=>{const names=new Set(desc(find(TREE,n)));return ART.filter(a=>a.g.some(g=>names.has(g))).length;};
const renderTree=(node,root)=>`<ul>${(node.c||[]).map(ch=>`<li class="${root?'root':''}"><button data-n="${esc(ch.n)}" class="${sel.has(ch.n)?'on':''}">${esc(ch.n)}<span class="n">${count(ch.n)}</span></button>${ch.c?renderTree(ch,false):''}</li>`).join('')}</ul>`;
function renderTax(){
  treeEl.innerHTML=renderTree(TREE,true);
  const withKids=$('#children').checked,all=$('#matchAll').checked;
  const sets=[...sel].map(n=>new Set(withKids?desc(find(TREE,n)):[n]));
  const hit=ART.filter(a=>sets.length&&(all?sets.every(s=>a.g.some(g=>s.has(g))):sets.some(s=>a.g.some(g=>s.has(g)))));
  const hits=new Set(sets.flatMap(s=>[...s]));
  $('#feedTitle').textContent=sel.size?`страница меток: ${[...sel].join(' + ')} · ${withKids?'с потомками':'без потомков'} · ${all?'все метки':'любая метка'} · материалов: ${hit.length}`:'выберите метку в дереве';
  feed.innerHTML=hit.length?hit.map(a=>`<div class="it"><div><b>${esc(a.t)}</b><div class="tags">${a.g.map(g=>`<span class="${hits.has(g)?'hit':''}">${esc(g)}</span>`).join('')}</div></div><span class="cat">${esc(a.c)}</span></div>`).join(''):'<div class="empty">по такому сочетанию материалов нет — ослабьте условие или включите потомков</div>';
}
treeEl.addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;const n=b.dataset.n;if(sel.has(n))sel.delete(n);else sel.add(n);renderTax();});
$('#children').addEventListener('change',renderTax);$('#matchAll').addEventListener('change',renderTax);
renderTax();
